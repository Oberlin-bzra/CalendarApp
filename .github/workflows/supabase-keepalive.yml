name: Supabase Keep-Alive

# Verhindert das Pausieren des kostenlosen Supabase-Projekts:
# schickt täglich eine kleine Anfrage an die Datenbank.

on:
  schedule:
    - cron: '0 6 * * *' # täglich um 06:00 UTC
  workflow_dispatch: # manuell auslösbar im Actions-Tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS "https://ibwsadfuohcfjndugbxr.supabase.co/rest/v1/events?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
